<title>Met Fifth Avenue Compass</title>

<script>
/* Appearance: the gallery (light) look is the default; Settings can switch to dark or follow the phone. Runs first to avoid a flash. */
(function(){ var t = "light"; try { t = localStorage.getItem("met-theme") || "light"; } catch(e) {}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: four tabs (Today, Map, Collection, Learn). The map is a full-screen stage with a search bar on top and a sheet that slides up.
   Everything else scrolls in one centered column. Works, the route, shows and settings open as full-screen pages. */
:root{
  --ground:#EDECE7; --surface:#FFFFFF; --mat:#E3E2DC; --mat2:#E8E6DF; --rule:#E3E2DC; --line:#CFCDC5;
  --ink:#17191C; --ink2:#2B2E33; --muted:#5B6168; --accent:#2342C0; --accent-ink:#FFFFFF; --accent-soft:rgba(35,66,192,.14);
  --signal:#B3361E; --plate:#17191C; --plate-fg:#FFFFFF; --plate-sub:#B9BDC4; --wall:#FFFFFF;
  --scrim:rgba(23,25,28,.94); --shadow:rgba(23,25,28,.28); --soft:rgba(23,25,28,.08);
  --f-sign:"Archivo","Helvetica Neue",Arial,sans-serif; --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --tabh:64px;
  --pv:#D6D4CB; --ph:#F3F2EE; --pr:#FFFFFF; --pe:#C4C1B6; --px:#E4E8F8; --pc:#F1E8D6; --pp:#CFE2E8; --pol:#17191C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111214; --surface:#1C1E21; --mat:#26282C; --mat2:#232529; --rule:#2C2F33; --line:#3A3D42;
  --ink:#ECEBE6; --ink2:#D5D4CF; --muted:#A2A7AE; --accent:#8EA2FF; --accent-ink:#0E1330; --accent-soft:rgba(142,162,255,.18);
  --signal:#F08A70; --plate:#ECEBE6; --plate-fg:#17191C; --plate-sub:#4A4E55; --wall:#1C1E21;
  --pv:#1E2023; --ph:#2A2C30; --pr:#34373C; --pe:#4A4D53; --px:#2E3656; --pc:#3B3528; --pp:#21363C; --pol:#8C9098;
  --scrim:rgba(0,0,0,.95); --shadow:rgba(0,0,0,.55); --soft:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#111214; --surface:#1C1E21; --mat:#26282C; --mat2:#232529; --rule:#2C2F33; --line:#3A3D42;
  --ink:#ECEBE6; --ink2:#D5D4CF; --muted:#A2A7AE; --accent:#8EA2FF; --accent-ink:#0E1330; --accent-soft:rgba(142,162,255,.18);
  --signal:#F08A70; --plate:#ECEBE6; --plate-fg:#17191C; --plate-sub:#4A4E55; --wall:#1C1E21;
  --pv:#1E2023; --ph:#2A2C30; --pr:#34373C; --pe:#4A4D53; --px:#2E3656; --pc:#3B3528; --pp:#21363C; --pol:#8C9098;
  --scrim:rgba(0,0,0,.95); --shadow:rgba(0,0,0,.55); --soft:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--f-sign);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.col{max-width:560px;margin:0 auto}
.stack{display:flex;flex-direction:column}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.accent{color:var(--accent)}
.serif{font-family:var(--f-serif)}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* page header */
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:18px}
.hdr h1{margin:0;font-size:30px;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.05}
.round{width:42px;height:42px;border-radius:21px;border:0;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:0 1px 3px var(--soft)}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.round:disabled{opacity:.35}

/* plates: the doorway number */
.plate{display:inline-flex;align-items:center;background:var(--plate);color:var(--plate-fg);border-radius:6px;padding:2px 7px;font-weight:800;font-stretch:125%;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.plate.s{font-size:12px;padding:1px 5px;border-radius:4px}
.plate.m{font-size:16px}
.plate.l{flex-direction:column;align-items:flex-start;padding:6px 9px 5px;border-radius:8px}
.plate.l small{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--plate-sub);font-weight:700;font-stretch:100%}
.plate.l span{font-size:24px;line-height:1}
.plate.out{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* surfaces */
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2,.sec-h h2{margin:0;font-size:18px;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{border:0;background:none;color:var(--accent);font-size:14px;font-weight:700;padding:4px 0}
.list{background:var(--surface);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.li{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule);cursor:pointer}
.li:last-child{border-bottom:0}
.li:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.li .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.li b{font-size:15px;font-weight:600;line-height:1.25}
.li .s{font-size:13px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;background:var(--signal);flex:none}
.end{font-size:13px;font-weight:700;color:var(--signal);white-space:nowrap}
.btn{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;padding:12px 16px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.q{background:var(--ground);color:var(--ink)}
.btn.w{background:var(--surface);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--ground)}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mat{background:var(--mat);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.mat img{max-width:84%;max-height:84%;box-shadow:0 6px 14px var(--shadow)}
.mat.flat img{box-shadow:none}
.mat .none{font-weight:800;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.progress{height:6px;border-radius:3px;background:var(--mat);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* chips + segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--mat);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:700;color:var(--muted);padding:8px 2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;background:var(--surface);color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:700}
.chip.route[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabbar button[aria-selected="true"] svg{stroke-width:2.1}

/* Today */
.next{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.next .mat{width:104px;height:104px}
.next b{font-family:var(--f-serif);font-size:20px;font-weight:600;line-height:1.2}
.shows-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.shows-row::-webkit-scrollbar{display:none}
.showcard{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:158px;min-height:124px;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;background:var(--surface);color:var(--ink)}
.showcard.dark{background:var(--plate);color:var(--plate-fg)}
.showcard .n{font-size:26px;font-weight:800;font-stretch:125%;line-height:1;font-variant-numeric:tabular-nums}
.showcard b{font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.showcard .s{font-size:12px;opacity:.75}
.preset{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.preset b{font-size:16px}
.preset p{margin:0;font-size:14px;color:var(--muted);grid-column:1}
.preset .go{grid-row:1 / span 2;grid-column:2;font-size:14px;font-weight:700;color:var(--accent)}

/* Map */
.mapview{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:var(--ground);overflow:hidden;z-index:5}
.stage{position:absolute;left:4px;right:58px;top:calc(env(safe-area-inset-top,0px) + 112px);bottom:var(--peek,300px);display:grid;place-items:center}
.stage svg{width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.maptop{position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;z-index:3;max-width:592px;margin:0 auto}
.search{background:var(--surface);border-radius:16px;height:50px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;box-shadow:0 2px 10px var(--soft)}
.search svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{border:0;outline:0;background:transparent;font-size:16px;flex:1;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search .x{border:0;background:var(--mat);border-radius:12px;width:30px;height:30px;display:grid;place-items:center;flex:none}
.search .x svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2.4}
.floors{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 120px);background:var(--surface);border-radius:14px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 10px var(--soft);z-index:3}
.floors button{width:40px;height:36px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:700;color:var(--muted)}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:800}
.zoombtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));z-index:3}
.msheet{position:absolute;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top,0px) - 112px);background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -4px 20px var(--soft);z-index:4;display:flex;flex-direction:column;
  transform:translate3d(0,var(--sy,60%),0);transition:transform .34s cubic-bezier(.2,.85,.25,1);will-change:transform}
.msheet.drag{transition:none}
.handle{border:0;background:none;padding:12px 0 10px;width:100%;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
.handle i{width:40px;height:5px;border-radius:3px;background:var(--line);display:block}
.handle .hint{display:none;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.maptop,.floors{transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .2s ease}
.mapview.full .handle .hint{display:block}
.mapview.fullstage .stage,.mapview.fullstage .offplan{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:56px}
.mapview.full .maptop{transform:translateY(-140%);opacity:0;pointer-events:none}
.mapview.full .floors{transform:translateY(-108px)}
@media (prefers-reduced-motion: reduce){.msheet,.maptop,.floors{transition:none}}
.msbody{flex:none;overflow-y:auto;overscroll-behavior:contain;padding:4px max(18px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:14px;max-width:592px;width:100%;margin:0 auto}
.here{display:flex;gap:12px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thumb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb .mat{height:86px}
.thumb b{font-size:12.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb .s{font-size:11.5px;color:var(--muted)}
.thumb .s.on{color:var(--accent);font-weight:700}
.rowline{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--rule)}
.wc{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--ground);font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}
.wc.food{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.wc.food svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wc.show{border-radius:13px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:11px}
.wc.show.soon{box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--muted)}
.numin{display:flex;gap:8px}
.numin input::placeholder{color:var(--line)}
.numin input{flex:1;min-width:0;font-size:24px;font-weight:800;font-stretch:125%;letter-spacing:.04em;border:0;border-radius:12px;background:var(--ground);padding:8px 12px;color:var(--ink);font-variant-numeric:tabular-nums}
.offplan{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 120px);bottom:var(--peek,300px);display:grid;place-items:center;padding:0 72px 0 24px;text-align:center}
.offplan b{display:block;font-size:44px;font-weight:800;font-stretch:125%}
/* map svg */
.bwall{fill:var(--wall);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.zn{fill:var(--mat2);cursor:pointer;transition:fill .15s}
.zn.alt{fill:var(--mat)}
.zn.sel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.zn.right{fill:var(--accent)} .zn.wrong{fill:var(--signal);fill-opacity:.45}
.zn.hi{fill:var(--accent-soft)}
.zl{fill:var(--muted);font-family:var(--f-sign);font-size:6.6px;font-weight:700;letter-spacing:.06em;pointer-events:none}
.zl.on{fill:var(--accent-ink)}
.xb{fill:var(--mat)} .xl{fill:var(--muted);font-size:6px;font-weight:800;font-stretch:125%;pointer-events:none}
.compass{fill:var(--muted);font-size:7px;font-weight:700;letter-spacing:.18em}
.mk-wc rect{fill:var(--ink)} .mk-wc text{fill:var(--ground);font-size:6.5px;font-weight:800}
.mk-wc.m rect{fill:var(--wall);stroke:var(--ink);stroke-width:1.4} .mk-wc.m text{fill:var(--ink)}
.mk-food circle{fill:var(--wall);stroke:var(--ink);stroke-width:1.4} .mk-food path{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round} .mk-food text{fill:var(--ink);font-family:Georgia,serif;font-style:italic;font-size:9px}
.mk-show circle{fill:var(--wall);stroke:var(--ink);stroke-width:1.5} .mk-show text{fill:var(--ink);font-size:7px;font-weight:800}
.mk-show.soon circle{stroke:var(--muted);stroke-dasharray:2.5 2} .mk-show.soon text{fill:var(--muted)}
.route,.stop,.mk-wc,.mk-food,.mk-show,.you,.pin,.xl,.compass{pointer-events:none}
.route{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:6 4;stroke-linecap:round;stroke-linejoin:round}
.stop circle{fill:var(--wall);stroke:var(--accent);stroke-width:2} .stop text{fill:var(--accent);font-size:7.5px;font-weight:800}
.stop.done circle{fill:var(--ink);stroke:var(--ink)} .stop.done text{fill:var(--ground)}
.stop.next circle{fill:var(--accent)} .stop.next text{fill:var(--accent-ink)}
.you .ring{fill:var(--accent);fill-opacity:.18} .you .core{fill:var(--accent);stroke:var(--wall);stroke-width:2.4}
.pin{fill:var(--accent);stroke:var(--wall);stroke-width:1.6}
.pshell{fill:var(--pv);stroke:var(--pol);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pfloor{fill:var(--ph)} .ppool{fill:var(--pp)}
.rm{fill:var(--pr);stroke:var(--pe);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.rm.ex{fill:var(--px)} .rm.cafe{fill:var(--pc)}
.rm.hi{fill:color-mix(in srgb,var(--accent) 12%,var(--pr))}
.rm.sel{fill:color-mix(in srgb,var(--accent) 22%,var(--pr));stroke:var(--accent)}
.rm.selg{fill:var(--accent);stroke:var(--accent)}
.rm.right{fill:var(--accent);stroke:var(--accent)} .rm.wrong{fill:color-mix(in srgb,var(--signal) 45%,var(--pr))}
.gn{display:none;fill:var(--muted);font-family:var(--f-sign);font-size:3.3px;font-weight:700;font-stretch:112%;font-variant-numeric:tabular-nums;pointer-events:none}
.gn.on{fill:var(--accent-ink)}
svg.near .gn{display:inline} svg.close .gn{font-size:2.9px}
.zlab{outline:none} .zlab:focus-visible .zl{fill:var(--accent)}
.zl{fill:var(--ink2);font-family:var(--f-sign);font-size:6.2px;font-weight:800;letter-spacing:.07em;pointer-events:none;paint-order:stroke;stroke:var(--pr);stroke-width:2.2px;stroke-linejoin:round}

 ["Hands clasped around a cup and huge inlaid eyes of shell and black stone.","Buried in a temple at Tell Asmar in Iraq, figures like this stood in for their owners, praying to the god without a break."],

 ["The cuneiform inscription carved across his robe, and his calm folded hands.","Gudea ruled the city-state of Lagash. Dozens of his statues survive, and nearly all present him as a pious temple builder."],

 ["Hellenistic","Greek art after Alexander the Great (323–31 BCE), known for emotion, movement and everyday subjects.","Cast in bronze with the lost-wax method, then finished by hand.","After Alexander's conquests, Greek culture spread across the Mediterranean, and art turned to babies, old age, sleep and drama.",59,"Playful children in marble, inspired by ancient works like this.","Why show a god asleep?"],
 ["Contrapposto","A pose with the weight on one leg, so hips and shoulders tilt in opposite directions.","A Roman marble copy of a Greek bronze. The support by the leg was needed because marble is heavier and weaker than bronze.","Romans admired Greek art and filled their villas and gardens with copies of famous statues.",12,"The stiff early pose this relaxed one grew out of.","Is a copy still a masterpiece?"],
 ["Fresco","Painting on wet plaster, so the color becomes part of the wall.","Painted on fresh lime plaster with architecture that seems to open the walls onto views.","Wealthy Romans built country villas near Pompeii. Vesuvius buried them in 79 CE, which preserved the paint.",45,"Painted depth again, worked out with mathematics 1,500 years later.","Why would someone want painted windows in a bedroom?"],
 ["Sarcophagus","A stone coffin, often carved with scenes.","Carved from one block of marble with drills and chisels, cut deep to make strong shadows.","In the 200s CE, wealthy Romans shifted from cremation to burial, which created a market for carved coffins.",13,"An earlier Greek way of honoring the dead.","Why carve the wine god Dionysos on a coffin?"],
 ["Pylon","The monumental gateway in front of an Egyptian temple.","Sandstone blocks carved with reliefs of the Roman emperor Augustus making offerings to Egyptian gods.","Built around 15 BCE, when Egypt was a Roman province. Augustus appears dressed as a pharaoh.",2,"An Egyptian building you can enter, 2,300 years older.","What does it mean for a Roman emperor to appear as a pharaoh?"],
 ["Bodhisattva","In Buddhism, an enlightened being who helps others reach enlightenment. Maitreya will be the Buddha of the future.","Gilt bronze: cast bronze covered with a thin layer of gold.","Under the Northern Wei dynasty (386–534), Buddhism spread across north China with royal support.",22,"Another sacred bronze, made 500 years later in south India.","Why surround one figure with so many attendants?"],
 ["Handscroll","A long horizontal painting viewed by unrolling one section at a time.","Ink on paper, with seals and inscriptions added by owners over 1,200 years.","China's Tang dynasty (618–907) prized horses from Central Asia, and the emperor's horses were famous.",27,"Another East Asian work on paper, this one printed in thousands.","Do the collectors' seals spoil the picture or add to it?"],
 ["Lost-wax casting","A model in wax is covered in clay, the wax is melted out, and metal is poured into the space.","Solid bronze cast by lost wax. Each mold is broken, so every statue is one of a kind.","The Chola dynasty ruled south India from the 800s to the 1200s and built great temples to Shiva.",20,"A Buddhist bronze from China, with a different message.","How can one dance be both destruction and creation?"],
 ["Mural","A painting made directly on a wall.","Painted on a clay wall, then cut into sections and remounted in the 1920s.","China's Yuan dynasty (1271–1368) was ruled by the Mongols, who supported Buddhist temples.",17,"A Roman painted wall, also moved from its building to a museum.","Should a temple's wall be in a museum?"],
 ["Mandala","A diagram of the universe used as an aid to meditation.","Woven silk tapestry (kesi): each color is woven as its own patch, leaving tiny slits between.","The Mongol court of Yuan China followed Tibetan Buddhism and commissioned works like this.",30,"Another woven masterpiece made for rulers.","Why put the donors into a sacred picture?"],
 ["Ritual bronze","Bronze vessels used to offer food and wine to ancestors.","Cast in clay piece molds, a Chinese method different from lost wax.","Early Zhou kings (from about 1046 BCE) claimed a Mandate of Heaven and backed it with ancestor rituals.",22,"Bronze cast a different way, 2,000 years later.","How do objects keep a family's memory alive?"],
 ["Scholar's garden","A small walled garden for study, poetry and quiet.","Built in 1981 by craftsmen from Suzhou using traditional tools, tiles and timber.","Ming dynasty (1368–1644) scholars designed gardens to feel like a whole landscape in a small space.",31,"Another complete room brought here from far away.","How does a garden make a small space feel large?"],
 ["Woodblock print","An image printed from carved wooden blocks, one block for each color.","Designed by Hokusai, cut by a carver and printed by a printer, in thousands of copies.","In Edo-period Japan (1603–1868), city dwellers bought inexpensive prints of actors, beauties and landscapes.",75,"Monet collected Japanese prints, and you can see it here.","Is a print worth less than a one-of-a-kind painting?"],
 ["Mihrab","A niche in a mosque wall that shows the direction of Mecca for prayer.","Tile mosaic: glazed tiles cut into pieces and fitted together, with Qur'anic inscriptions.","Isfahan was a major center of art and learning in medieval Iran.",10,"Glazed clay on a wall, 1,900 years earlier in Babylon.","Why might a sacred space use words and patterns instead of people?"],
 ["Illumination","Painting made for a handwritten book.","Opaque watercolor, ink and gold on paper, often shared among several painters in a royal workshop.","The Shahnama, or Book of Kings, is Iran's national epic, finished by the poet Firdausi around 1010.",21,"A Chinese painting meant to be unrolled rather than leafed through.","How is a picture in a book different from one on a wall?"],
 ["Knotted pile","A carpet made by tying thousands of short knots of yarn onto threads, then trimming them.","Silk and wool, knotted by hand.","Safavid Iran (1501–1736) made carpets in royal workshops, often as diplomatic gifts.",24,"A tapestry for rulers, woven a different way.","Is a carpet art or furniture?"],
 ["Period room","A real room taken from a building and rebuilt inside a museum.","Painted and gilded wood panels, some with raised designs.","Damascus under the Ottomans had wealthy merchant houses built around courtyards.",46,"A Renaissance room rebuilt the same way.","What would a room from your home tell a visitor 300 years from now?"],
 ["Olmec","The earliest major civilization of Mesoamerica, on Mexico's Gulf Coast, about 1200–400 BCE.","Hollow ceramic, modeled by hand, with a smooth white surface.","The Olmec built ceremonial centers and carved colossal stone heads. Later cultures, including the Maya, borrowed their imagery.",5,"Another ancient figure that is surprisingly lovable.","Why might a culture make so many images of babies?"],
 ["Terracotta","Fired clay. The name is Italian for \"baked earth.\"","Modeled by hand and fired.","Djenné-Jeno, on the Niger River in Mali, was a trading city for more than 1,000 years.",34,"Another West African masterpiece, made for a royal court.","What do we lose when we don't know where an object was found?"],
 ["Ivory","The hard material of elephant tusks, used for fine carving.","Carved ivory with iron inlaid in the eyes and forehead.","The Kingdom of Benin, in today's Nigeria, was ruled by the Oba. Royal artists worked in guilds.",6,"Another portrait of a powerful woman.","How does showing a mother honor a king?"],
 ["Abstraction","Simplifying forms instead of copying them exactly.","Carved from a single piece of wood.","The Dogon live on cliffs and plateaus in Mali. From the 1920s on, sculpture like this was eagerly collected in Paris.",97,"Modern artists borrowed this kind of simplification.","Why might simple shapes feel more powerful than realistic ones?"],
 ["Nkisi","A Kongo object filled with medicines and activated by a ritual specialist called an nganga.","Wood carved by an artist, then loaded with materials and nails by the nganga over many years.","Kongo is in today's Congo and Angola. Figures like this settled disputes and sealed agreements.",37,"Another object made to be used rather than displayed.","Is a work finished when the carver stops?"],
 ["Openwork","Carving that cuts all the way through, so light passes between the forms.","Carved from mangrove trees. The openwork wing at the top comes from a root.","The Asmat of southwest New Guinea carved bis poles for feasts that honored and avenged the dead.",38,"More Pacific art, this time overhead.","How is a memorial made for one feast different from one made to last?"],
 ["Ceremonial house","A building for rituals and meetings, often richly decorated inside.","Painted panels made from sago palm, colored with natural pigments.","In Kwoma villages in Papua New Guinea, men's ceremonial houses have ceilings covered in painted panels of clan stories and spirits.",31,"Another room-sized work brought into the museum.","How does art change when you look up at it?"],
 ["Byzantine","The eastern Roman Empire, ruled from Constantinople (today's Istanbul) from 330 to 1453.","Cast silver, then chased and engraved to sharpen the details.","Some scholars link the David story to Emperor Heraclius's victory over Persia in 628.",88,"Another image of a hero's victory.","Why tell a Bible story on fine silver plates?"],
 ["Reja","A Spanish ironwork screen enclosing part of a church.","Wrought iron hammered and shaped by blacksmiths, with a gilded crest.","Spanish cathedrals often closed off the choir, where clergy sang the daily services, with tall iron screens.",47,"More Spanish craftsmanship, in marble instead of iron.","How does a screen change how you feel about what's behind it?"],
 ["Crèche","A Nativity scene with figures arranged around the birth of Jesus.","Heads carved in wood or modeled in terracotta, with wire bodies dressed in silk.","Naples in the 1700s had a craze for elaborate crèches with hundreds of everyday figures.",42,"An earlier, simpler image of mother and child.","Why fill a sacred scene with ordinary people?"],
 ["Tempera","Paint made from pigment mixed with egg yolk, used before oil paint.","Tempera and gold leaf on a wooden panel.","Around 1300, Siena rivaled Florence, and Duccio was its leading painter.",43,"Oil paint arrives a century later. Compare the detail.","What makes the child's gesture feel so human?"],
 ["Oil glaze","A thin, transparent layer of oil paint. Stacking glazes gives deep, glowing color.","Oil paint on wood panels, built up in layers. The panels were later moved onto canvas.","In 1400s Flanders, today's Belgium, wealthy merchants and dukes paid for detailed devotional pictures.",42,"Egg tempera from a century earlier.","Why paint so much detail into something so small?"],
 ["Genre painting","A picture of everyday life.","Oil on an oak panel.","Bruges was a trading hub, and goldsmiths were among its wealthiest craftsmen.",64,"A mirror and an open door also stretch Vermeer's space.","Is this a religious painting or an advertisement?"],
 ["Linear perspective","A system in which parallel lines meet at a vanishing point to create depth.","Tempera and gold on wood.","Florentine artists worked out perspective in the 1400s, starting with the architect Brunelleschi.",17,"A Roman painter faking depth by eye 1,500 years earlier.","Where does the perspective lead your eye?"],
 ["Intarsia","Pictures made by fitting together pieces of different woods.","Thousands of pieces of different woods cut and set into panels.","Federico da Montefeltro, Duke of Urbino, was a professional soldier who also built a famous library.",31,"Another complete room, made 200 years later in Damascus.","What would your own study say about you?"],
 ["Patio","An open courtyard surrounded by arcades.","Carved marble, likely by Italian-trained stone carvers.","Spain in the early 1500s, just after 1492, was becoming a global power and importing Italian Renaissance ideas.",46,"Another piece of Renaissance building moved indoors.","How does a courtyard change the way a building feels?"],
 ["High Renaissance","About 1490 to 1527, when Leonardo, Michelangelo and Raphael were working.","Oil and gold on wood panels.","Altarpieces stood behind church altars. The nuns of Sant'Antonio in Perugia ordered this one.",42,"A Madonna 200 years earlier. What has changed?","How does the balanced arrangement make you feel?"],
 ["Greenwich armor","Armor made in Henry VIII's royal workshop at Greenwich, near London.","Steel plates hammered to shape and joined with rivets and leather straps.","Henry set up the Greenwich workshop with German armorers to rival the best in Europe.",50,"Later Greenwich armor, made for a courtier.","What did armor say about a king who rarely fought by then?"],
 ["Bluing","Heating steel to give it a blue-black color that also resists rust.","Steel, blued, etched and gilded. The design appears in an album of Greenwich armor designs.","Tournaments at Elizabeth I's court were theater as much as sport.",49,"The king's armor from the same workshop.","When does protective gear become fashion?"],
 ["Plate armor","Armor of shaped steel plates, used in Europe from about 1400.","Assembled from armors of different dates and places to make the display.","By the 1500s, guns made full armor less useful in war, so it shifted toward tournaments and parades.",14,"An ancient vehicle made for show.","Why put horses in armor too?"],
 ["Ō-yoroi","\"Great armor\": Japanese armor for mounted archers, made of small scales laced together with silk.","Small plates of lacquered leather and iron laced with silk cord.","Samurai rose to power in Japan between the 1100s and 1300s.",49,"A European answer to the same problem.","What's gained by building armor from many small pieces?"],
 ["Landscape","A painting in which the land itself is the main subject.","Oil on wood panel.","Bruegel painted this in 1565 as one of a set of seasons for Niclaes Jongelinck, a wealthy Antwerp merchant, for his house.",87,"An American landscape 270 years later.","Is this painting about work or about rest?"],
 ["Venetian color","Venice's emphasis on rich color and loose brushwork over crisp drawing.","Oil on canvas.","Venetian painters of the 1500s favored oil on canvas over fresco, which suffered in the city's damp air.",74,"Another reclining nude, 300 years later, that caused a scandal.","Is the musician looking at Venus or at us?"],
 ["Mannerism","The style after the High Renaissance, with stretched forms, unusual colors and drama.","Oil on canvas.","El Greco was born on Crete, trained in Venice and Rome, then settled in Toledo, Spain.",82,"Another landscape bent by emotion, 300 years later.","Why would a painter rearrange a real city?"],
 ["Naturalism","Painting people as they really look rather than in an idealized way.","Oil on canvas.","In 1590s Rome, cardinals collected paintings of music and young men.",57,"A painter shaped by Caravaggio, using the same drama.","Who do you think this painting was made for?"],
 ["Baroque","Art of the 1600s, full of drama, movement and strong light.","Oil on canvas.","Artemisia trained with her father, the painter Orazio Gentileschi, and became the first woman in Florence's Academy of Design.",69,"Another woman painter who made her case on canvas.","Whose side is the painter on?"],
 ["Moral picture","A scene that warns the viewer about a vice, like greed or foolishness.","Oil on canvas.","After Caravaggio, paintings of cheats, cardsharps and fortune-tellers became popular across Europe.",56,"Caravaggio's own young men, painted 40 years earlier.","Who in this picture is really in control?"],
 ["Faun","A woodland creature from myth, part man and part goat.","Marble, carved with drills to make deep hollows and fine details.","In the early 1600s, popes and cardinals rebuilt Rome. The young Bernini worked alongside his father, Pietro.",15,"An ancient baby god that sculptors like Bernini studied.","How can hard stone look soft and in motion?"],
 ["Impasto","Paint laid on thickly so it stands up from the surface.","Oil on canvas.","A Sicilian nobleman, Antonio Ruffo, ordered this painting from Rembrandt in Amsterdam.",61,"Rembrandt turning the same deep shadow on himself.","What do you think Aristotle is thinking?"],
 ["Self-portrait","An artist's picture of themselves. Rembrandt made dozens over his lifetime.","Oil on canvas.","Rembrandt had gone bankrupt a few years earlier but kept painting.",81,"Van Gogh studying his own face 230 years later.","Why would an artist paint himself again and again?"],
 ["Portraiture","The art of representing a specific person.","Oil on canvas with quick, loose strokes.","Velázquez painted it in Rome in 1650 and showed it publicly at the Pantheon, where it was widely praised.",92,"Another portrait that made its painter's name.","What does his gaze tell you?"],
 ["Camera obscura","A darkened box that projects an image through a lens. Some think Vermeer used one.","Oil on canvas, with ultramarine, an expensive blue made from ground lapis lazuli.","The Dutch Republic of the 1600s was a wealthy merchant society whose citizens bought paintings of homes and daily life.",64,"An earlier Vermeer, still finding his way.","Why does such a quiet moment feel important?"],
 ["Pentimento","A change an artist painted over, sometimes visible later.","Oil on canvas.","Dutch paintings of sleeping maids often hinted at laziness or love. Vermeer leaves it open.",63,"His later, calmer light.","What is the open door doing in the picture?"],
 ["Luthier","A maker of stringed instruments.","A spruce top and maple back, carved, joined and varnished.","Cremona, in northern Italy, was home to the great violin-making families: Amati, Guarneri and Stradivari.",66,"Another instrument maker who changed music.","Is a working instrument also a sculpture?"],
 ["Hammer action","The mechanism that strikes a string with a hammer instead of plucking it.","A wooden case with strings struck by leather-covered hammers.","Cristofori worked for the Medici court in Florence, looking after its musical instruments.",65,"A violin from the same generation of Italian makers.","What could musicians do with soft and loud that they couldn't before?"],
 ["Neoclassicism","Late 1700s art that revived Greek and Roman forms and moral stories.","Oil on canvas.","France in 1787 was close to revolution, and stories of virtue and sacrifice spoke to the moment.",70,"Neoclassicism in marble.","Is dying for a principle heroic or stubborn?"],
 ["Court painter","An artist officially employed by a royal court.","Oil on canvas.","Goya painted Spanish nobles before turning to darker work about war and madness.",77,"Children again, a century later, in Degas's ballet school.","Why put hungry cats in a child's portrait?"],
 ["Academy","The official institution that trained artists and ran the major exhibitions.","Oil on canvas.","The French Royal Academy allowed only four women members at a time.",57,"Another woman painter making her mark.","How can a painting make an argument?"],
 ["Ideal","A perfected body based on ancient models rather than a real person.","Marble, polished to a high finish.","Napoleon carried off the ancient Apollo Belvedere from the Vatican to Paris. Canova's Perseus took its place.",16,"An ancient body with the same calm.","Why look so calm holding a monster's head?"],
 ["Academic finish","Smooth paint with no visible brushstrokes.","Oil on canvas.","Ingres was the great defender of classical drawing in 1800s France.",74,"Courbet, who rejected all of this.","What does a perfect finish say about the person painted?"],
 ["Realism","Painting the world as it is, often everyday subjects, without idealizing.","Oil on canvas, more than 16 feet wide.","Bonheur was famous across Europe and America. Queen Victoria asked for a private viewing of this painting.",51,"Horses again, this time in armor.","How does sheer size change a painting's impact?"],
 ["Romanticism","Art of strong emotion and extreme situations.","Marble, carved from a full-size plaster model.","Carpeaux won France's top art prize, the Prix de Rome, and made this sculpture while studying in Rome.",59,"Another sculpture full of twisting bodies, with joy instead of despair.","How much suffering can a sculpture show?"],
 ["Salon","Paris's official annual exhibition, the main way artists built a career.","Oil on canvas.","Courbet led the Realist movement and loved provoking the art establishment.",54,"An older nude, protected by myth.","What made one nude acceptable and another a scandal?"],
 ["Impressionism","Painting light and modern life with quick, visible strokes, often outdoors.","Oil on canvas.","In the 1860s, young painters began working outdoors, helped by new paint sold in tubes.",27,"The Japanese prints that taught Monet these flat bands of color.","How does the high viewpoint flatten the picture?"],
 ["Plein air","Painting outdoors, in natural light.","Oil on canvas.","Manet painted alongside Monet at Argenteuil, a boating town on the Seine, in the summer of 1874.",75,"Monet's garden, seven years earlier.","Why cut off the boat at the edge?"],
 ["Asymmetrical composition","A layout that is deliberately off balance.","Oil on canvas.","The Paris Opera ballet was central to city life. Many of its young dancers came from poor families.",79,"Degas's dancer in three dimensions.","Why show dancers waiting instead of dancing?"],
 ["Patron","A person who pays for and supports an artist.","Oil on canvas.","Georges Charpentier published modern writers like Zola, and his wife hosted a famous salon.",92,"A society portrait that went badly wrong.","What does this room tell you about the family?"],
 ["Mixed media","A work that uses more than one material.","Bronze cast from Degas's wax original, dressed in a real fabric tutu and ribbon.","When Degas showed the wax figure in 1881, critics were shocked by its realism and the girl's working-class look.",77,"Degas's dancers on canvas.","Why add real fabric to a statue?"],
 ["Pointillism","Painting with small dots of pure color that blend in the viewer's eye.","Oil on canvas.","Seurat read color science, including theories about how colors change each other when placed side by side.",82,"Van Gogh's very different way of laying down color.","How can dots make light?"],
 ["Complementary colors","Colors opposite each other on the color wheel, like blue and orange, which make each other look stronger.","Oil on canvas in short, bright strokes.","In Paris (1886–88), Van Gogh met the Impressionists and brightened his dark early palette.",61,"Rembrandt studying his face 230 years earlier.","What changed in how Van Gogh saw himself?"],
 ["Post-Impressionism","Artists after Impressionism who pushed color and form toward personal expression.","Oil on canvas, with thick paint.","Van Gogh painted this in 1889 while a voluntary patient at the asylum in Saint-Rémy.",55,"El Greco's stormy landscape, 300 years earlier.","Does this painting feel calm or restless?"],
 ["Primitivism","Western artists borrowing from cultures they saw as simpler, an idea now widely questioned.","Oil on canvas.","Gauguin left France for Tahiti, then a French colony, in 1891.",35,"The kind of art Europeans borrowed from.","Whose view of Tahiti is this?"],
 ["Series","A group of works on the same subject.","Oil on canvas.","Cézanne worked in his hometown of Aix-en-Provence, using local farmworkers as models.",97,"Picasso, who learned from Cézanne's solid forms.","Why do these men feel like architecture?"],
 ["Series painting","Painting the same subject again and again in different light and seasons.","Oil on canvas.","Monet built his water garden at Giverny in the 1890s and painted it for the rest of his life.",26,"A garden designed for contemplation, from Ming China.","Is this a picture of a bridge or of light?"],
 ["Vienna Secession","Artists who broke from Vienna's official academy in 1897 to make modern, decorative art.","Oil on canvas.","Klimt led the Secession, and the Primavesi family supported Vienna's modern designers.",92,"Another portrait where clothing and setting say everything.","How does the patterned background change how you see the girl?"],
 ["The sublime","Nature so vast it inspires awe and even fear.","Oil on canvas.","Thomas Cole founded the Hudson River School, America's first landscape movement.",53,"A European landscape of work and harvest.","Which side of the painting do you think Cole prefers?"],
 ["History painting","A large scene of an important event, once ranked as the highest kind of art.","Oil on canvas, about 12 by 21 feet.","Leutze painted it in Düsseldorf, Germany, hoping to inspire European reformers after the failed revolutions of 1848.",9,"Assyrian kings shown as heroes, 2,700 years earlier.","The details are wrong. Does it matter?"],
 ["Panorama","A wide view meant to surround and absorb the viewer.","Oil on canvas, almost 10 feet wide.","Church followed the explorer-scientist Alexander von Humboldt's routes through South America.",87,"Cole's American landscape, made a generation earlier.","Is this science or spectacle?"],
 ["Scull","A light racing boat rowed with two oars by a single person.","Oil on canvas.","Eakins studied in Paris, then returned to Philadelphia and painted modern sporting life.",76,"A French boating scene from three years later.","Why did Eakins put himself in the picture?"],
 ["Impressionist exhibitions","Independent shows the Impressionists organized outside the official Salon.","Oil on canvas.","Cassatt, from Pennsylvania, was invited by Degas to show with the Impressionists.",77,"Her friend Degas at the ballet.","What does the sitter's posture tell you?"],
 ["Bravura","Fast, confident brushwork that shows off the painter's skill.","Oil on canvas.","Sargent showed it at the 1884 Paris Salon, and critics found it improper.",62,"An earlier portrait that made its painter's reputation.","Why was a single strap so shocking?"],
 ["Gilding","Covering a surface with a thin layer of gold.","Cast bronze. The original weathervane on Madison Square Garden was gilded to catch the light.","Saint-Gaudens designed the original as a weathervane for Madison Square Garden in the 1890s.",70,"A marble god with the same balance.","How does a statue made for a rooftop work up close?"],
 ["Narrative painting","A picture that tells a story.","Oil on canvas.","In his later years, Homer lived on the Maine coast and traveled to the Caribbean.",88,"Another man in a boat, this time a national hero.","Will the sailor survive?"],
 ["Prairie School","Frank Lloyd Wright's early style, with long, low horizontal lines suited to the Midwest.","Oak woodwork, art glass windows and built-in furniture.","Wright designed this house for Francis Little near Minneapolis, Minnesota.",31,"A room built 200 years earlier in Damascus.","How does a room tell you how to live in it?"],
 ["Favrile glass","Tiffany's name for his colored, textured and iridescent art glass.","Leaded glass: pieces of colored glass joined with strips of lead.","Tiffany Studios in New York employed many women designers, including Agnes Northrop.",28,"Another picture assembled from many small pieces.","How is light itself a material here?"],
 ["Cubism","Early 1900s art that breaks objects into flat planes seen from several angles. This portrait leads toward it.","Oil on canvas.","Gertrude Stein was an American writer in Paris whose home became a gathering place for modern artists.",35,"Simplified faces from African and Iberian art helped shape Picasso's new style.","Does a portrait need to look like the sitter?"],
 ["Precisionism","American modern art of sharp, clean, geometric forms.","Oil, ink and gold leaf on board.","Demuth made a series of \"poster portraits\" of his friends using words and symbols instead of faces.",97,"Another portrait that doesn't look like its subject.","Can a portrait have no face?"],
 ["Symbol","An image that stands for an idea.","Oil on canvas.","O'Keeffe began spending summers in New Mexico in 1929 and collected bones she found in the desert.",87,"Cole's America, a century earlier.","What makes this painting \"American\"?"],
 ["Abstract Expressionism","Postwar New York painting focused on gesture, emotion and large scale.","Enamel paint poured and flung onto unprimed canvas laid on the floor.","After World War II, New York replaced Paris as the center of the art world.",82,"Van Gogh's energetic brushwork, a starting point for gestural painting.","Is it chaos or control?"]

  if(pmode === "period") pool = ERAS.map(e => e[1]);
  else { const same = N100.filter(m => m !== n && W[m-1][4] === W[n-1][4]).map(answerOf), rest = N100.filter(m => m !== n).map(answerOf);
    pool = shuffle([...new Set(same)]).concat(shuffle([...new Set(rest)])); }

}
function renderPics(){

}

const fmtGap = g => `${(g >= 1000 ? Math.round(g / 100) * 100 : Math.round(g / 50) * 50).toLocaleString("en-US")} years`;

/* ================= key terms ================= */
const TERM_ORDER = N100.slice().sort((a, b) => CLASS[a-1][0].localeCompare(CLASS[b-1][0]));
let tq = null;
function startTerms(practice){
  const all = N100, qs = practice ? shuffle(missList("met-miss-terms")).slice(0, 10) : drawFromDeck("met-deck-terms", all, 10);
  if(!qs.length){ tq = null; renderTerms(); return; }
  tq = {qs, i: -1, score: 0, practice: !!practice}; nextTerm();
}
function nextTerm(){
  tq.i++; tq.answered = false;
  if(tq.i < tq.qs.length){ const n = tq.qs[tq.i], right = CLASS[n-1][0];
    const pool = shuffle([...new Set(N100.map(m => CLASS[m-1][0]).filter(t => t !== right))]);
    tq.opts = shuffle([right, ...pool.slice(0, 3)]); tq.right = right; }
  renderTerms();
}
function renderTerms(){

  const buttons = label => `<div class="${misses ? "row2" : "stack"}"><button class="btn" id="t-start">${label}</button>${misses ? `<button class="btn q" id="t-miss">Practice misses (${misses})</button>` : ""}</div>`;

  if(!tq){ c.innerHTML = `<span class="eyebrow">Vocabulary</span><p class="q">One key term for every work: 100 words that open up the whole museum.</p>${info}${buttons("Quiz me")}`; wire(); }
  else if(tq.i >= tq.qs.length){ c.innerHTML = `<span class="eyebrow">${tq.practice ? "Practice done" : "Done"}</span><p class="q">${tq.score} of ${tq.qs.length} right.</p>${info}${buttons("Next round")}`; wire(); }
  else {
    const n = tq.qs[tq.i];
    c.innerHTML = `<span class="eyebrow">${tq.practice ? "Practice · " : ""}Term ${tq.i + 1} of ${tq.qs.length} · ${tq.score} right</span>
      <p class="serif" style="margin:0;font-size:19px;line-height:1.45">${esc(CLASS[n-1][1])}</p><p class="small" style="margin:0">Which term is this?</p>
      <div class="opts">${tq.opts.map((o, i) => `<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>
      <p class="fb" id="tfb"></p><div class="row2" id="t-after" hidden><button class="btn q" id="t-lesson">See the work</button><button class="btn" id="t-next">${tq.i + 1 < tq.qs.length ? "Next" : "See score"}</button></div>`;
    c.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if(tq.answered) return; tq.answered = true;
      const ok = tq.opts[+b.dataset.o] === tq.right; if(ok) tq.score++; markMiss("met-miss-terms", n, !ok);
      c.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(tq.opts[+x.dataset.o] === tq.right) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      const fb = $("#tfb"); fb.className = "fb " + (ok ? "ok" : "no"); fb.textContent = (ok ? "Right. " : `It's “${tq.right}”. `) + `Example: ${W[n-1][0]}.`;
      $("#t-after").hidden = false; $("#t-next").onclick = nextTerm; $("#t-lesson").onclick = () => openWork(n);
    });
  }
  if(!$("#tlist").dataset.built){
    let html = "", letter = "";
    TERM_ORDER.forEach(n => { const t = CLASS[n-1][0], L0 = t[0].toUpperCase();
      if(L0 !== letter){ if(letter) html += `</div>`; letter = L0; html += `<div class="sec-h" style="margin:14px 2px 6px"><h2>${L0}</h2></div><div class="list">`; }
      html += `<button class="li" data-w="${n}" style="grid-template-columns:1fr auto"><span class="t"><b class="serif" style="font-size:16px">${esc(t)}</b><span class="s" style="white-space:normal">${esc(CLASS[n-1][1])}</span><span class="s" style="color:var(--accent)">${esc(W[n-1][0])}</span></span><span></span></button>`; });
    $("#tlist").innerHTML = html + `</div>`; $("#tlist").dataset.built = "1";
  }

/* ================= shared list sync ================= */
let syncState = "off", syncErr = "", lastSync = 0, syncT = null, syncing = false;
const syncOn = () => !!(cfg.url && cfg.code);
function queueSync(){ if(!syncOn()) return; clearTimeout(syncT); syncT = setTimeout(doSync, 1200); }
const KINDS = ["seen","fav","notes"];
function toRemote(st){ const o = {}; KINDS.forEach(k => { o[k] = {}; Object.keys(st[k] || {}).forEach(n => { o[k]["w" + n] = st[k][n]; }); }); return o; }
function fromRemote(r){ const o = {seen:{}, fav:{}, notes:{}}; if(!r) return o;
  KINDS.forEach(k => { const src = r[k] || {}; Object.keys(src).forEach(key => { const n = +key.replace(/^w/, ""); if(n >= 1 && n <= 100 && src[key]) o[k][n] = src[key]; }); }); return o; }
function mergeStores(a, b){ const o = {seen:{}, fav:{}, notes:{}};
  KINDS.forEach(k => { const A = a[k] || {}, B = b[k] || {};
    new Set([...Object.keys(A), ...Object.keys(B)]).forEach(n => { const x = A[n], y = B[n]; o[k][n] = !x ? y : !y ? x : ((y.t || 0) > (x.t || 0) ? y : x); }); });
  return o; }
const sig = st => KINDS.map(k => Object.keys(st[k] || {}).map(Number).sort((a, b) => a - b).map(n => `${n}:${st[k][n].t}:${JSON.stringify(st[k][n].v)}`).join(",")).join("|");
const dbBase = () => cfg.url.trim().replace(/\/+$/, "").replace(/\.json$/, "");
async function doSync(){
  if(!syncOn()){ syncState = "off"; updSync(); return; }
  if(syncing) return;
  if(navigator.onLine === false){ syncState = "offline"; updSync(); return; }
  syncing = true; syncState = "syncing"; updSync();
  const url = `${dbBase()}/households/${encodeURIComponent(cfg.code)}.json`;
  try {
    const r = await fetch(url, {cache: "no-store"});
    if(!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "The database refused access. Check its rules (step 4 of the setup)." : `The database answered ${r.status}.`);
    const remote = fromRemote(await r.json()), merged = mergeStores(store, remote);
    if(sig(merged) !== sig(remote)){
      const w = await fetch(url, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(toRemote(merged))});
      if(!w.ok) throw new Error(w.status === 401 || w.status === 403 ? "The database refused to save. Check its rules (step 4 of the setup)." : `Saving failed (${w.status}).`);
    }
    const changed = sig(merged) !== sig(store);
    store = merged; saveStore(); rebuild();
    if(changed){ refreshAll(); if(!$("#work").hidden && document.activeElement !== $("#w-note") && wList[wIdx]) showWork(wList[wIdx]); }
    syncState = "ok"; lastSync = Date.now(); syncErr = "";
  } catch(e){
    syncState = "error";
    syncErr = inFrame ? "Sharing works in the version on your website, not inside this preview." : (e && e.message && !/fetch/i.test(e.message) ? e.message : "Couldn't reach the database. Check the address and your connection.");
  }
  syncing = false; updSync();
}
setInterval(() => { if(!document.hidden) doSync(); }, 45000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) doSync(); });
window.addEventListener("online", doSync);
function statusText(){
  if(syncState === "off") return ["", "Not set up. Your list stays on this phone."];
  if(syncState === "syncing") return ["syncing", "Syncing…"];
  if(syncState === "offline") return ["", "Offline. Changes will sync when you're back online."];
  if(syncState === "error") return ["error", syncErr];
  const mins = Math.round((Date.now() - lastSync) / 60000); return ["ok", `Synced ${mins < 1 ? "just now" : mins + " min ago"}`];
}
function updSync(){ const el = $("#set-status"); if(!el) return; const [c, t] = statusText(); el.className = "status " + c; el.innerHTML = `<i></i>${esc(t)}`; }
function newCode(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; const r = new Uint32Array(12); crypto.getRandomValues(r); r.forEach((v, i) => { s += a[v % a.length]; if(i === 3 || i === 7) s += "-"; }); return s; }
const setupCode = () => `${dbBase()}#${cfg.code}`;
async function copyText(txt, el){

  catch(e){ if(el){ const rg = document.createRange(); rg.selectNodeContents(el); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); } toast("Select the text and copy it"); }
}
function openSettings(){ renderSettings(); openPage("settings"); $("#settings").scrollTop = 0; }
function renderSettings(){

  $("#settings").innerHTML = `<div class="bar"><button class="round" id="set-close" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>Settings and sharing</b><span style="width:42px"></span></div>
    <div class="body">
    <div class="card"><span class="eyebrow" id="set-app-l">Appearance</span>
      <div class="seg" id="set-theme" role="group" aria-labelledby="set-app-l">
        <button data-t="light" aria-pressed="${theme === "light"}">Gallery</button><button data-t="dark" aria-pressed="${theme === "dark"}">Dark</button><button data-t="system" aria-pressed="${theme === "system"}">Match phone</button></div>
      <p class="small" style="margin:0">Gallery is the light look the app was designed in. Dark is easier on the eyes in dim rooms like the Asian and prints galleries. Saved on this phone.</p></div>

      <label class="eyebrow" for="set-url">Database address</label>
      <input class="field" id="set-url" value="${esc(cfg.url)}" placeholder="https://your-project-default-rtdb.firebaseio.com" inputmode="url" autocapitalize="off" spellcheck="false">

      <div class="fieldrow"><input class="field" id="set-code" value="${esc(cfg.code)}" placeholder="Tap New" autocapitalize="characters" spellcheck="false"><button class="btn q" id="set-new">New</button></div>
      <div class="row2"><button class="btn" id="set-save">Save and sync</button><button class="btn q" id="set-sync">Sync now</button></div>
      ${syncOn() ? `<span class="eyebrow" style="margin-top:6px">Set up the other phone</span>

      <div class="code" id="set-rules">{ "rules": { ".read": false, ".write": false, "households": { "$code": { ".read": "$code.length >= 12", ".write": "$code.length >= 12" } } } }</div>
      <button class="btn q" id="set-copyrules" style="margin-top:8px;width:100%">Copy the rules</button>
      <ol class="steps" start="5"><li>Back here, paste the address, tap <b>New</b> for a household code, then <b>Save and sync</b>.</li>
        <li>Copy the setup code and send it to the other phone. They paste it under "Paste a setup code".</li></ol>
      <p class="small">Anyone with both the address and the code can see and change the list, so share the setup code only with each other.</p></details>
    <div class="card"><span class="eyebrow">On this phone</span>
      <p style="margin:0">${seen.size} seen · ${favs} ${favs === 1 ? "favorite" : "favorites"} · ${notes} ${notes === 1 ? "note" : "notes"} · ${plan.length} on your route</p>
      <p class="small" style="margin:0">Everything is saved on the phone too, so the app works offline.</p></div>
    <p class="small">App version ${APP_VERSION}. An unofficial study guide, not made by the Met. Images: The Met Open Access, plus seven from Wikipedia and Wikimedia Commons, credited on each work. The plan is a simplified drawing; works move between rooms.</p>
    </div>`;
  updSync();
  $("#set-close").onclick = () => closePage("settings");
  $("#set-theme").onclick = e => { const b = e.target.closest("[data-t]"); if(!b) return; setTheme(b.dataset.t);
    $("#set-theme").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.t === theme))); };
  $("#set-name").addEventListener("change", e => { cfg.name = e.target.value.trim(); saveCfg(); });
  $("#set-new").onclick = () => { $("#set-code").value = newCode(); };
  $("#set-save").onclick = () => {
    cfg.name = $("#set-name").value.trim(); cfg.url = $("#set-url").value.trim(); cfg.code = $("#set-code").value.trim().toUpperCase();
    if(cfg.url && !/^https:\/\/[^\s]+$/.test(cfg.url)){ toast("The address should start with https://"); return; }
    if(cfg.code && cfg.code.replace(/-/g, "").length < 10){ toast("Use a longer code. Tap New for one."); return; }
    saveCfg(); renderSettings(); doSync(); };
  $("#set-sync").onclick = doSync;
  $("#set-apply").onclick = () => { const v = $("#set-paste").value.trim(), i = v.lastIndexOf("#");
    if(i < 8){ toast("That doesn't look like a setup code"); return; }
    cfg.url = v.slice(0, i); cfg.code = v.slice(i + 1).toUpperCase(); cfg.name = $("#set-name").value.trim() || cfg.name; saveCfg(); renderSettings(); doSync(); };
  const cp = $("#set-copy"); if(cp) cp.onclick = () => copyText(setupCode(), $("#set-codeout"));
